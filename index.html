<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodieland</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/ad33c04fd0.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- Header -->
    <div id="header" class="fixed-top mx-auto">
        <div class="mx-auto" style="max-width: 1770px">
            <div class="navbar navbar-expand-xl">
                <div class="container-fluid ps-3">
                    <div class="logo-container">
                        <a href="#" class="navbar-brand">
                            <img src="image/Logo-Foodieland.jpg" class="img-fluid" alt="Logo">
                        </a>
                    </div>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="navMenu"
                        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse flex-grow-1" id="navMenu">
                        <ul class="navbar-nav mx-auto gap-3">
                            <li class="nav-item">
                                <a href="#home" class="nav-link">Home</a>
                            </li>
                            <li class="nav-item">
                                <a href="#recipes" class="nav-link">Recipes</a>
                            </li>
                            <li class="nav-item">
                                <a href="#blog" class="nav-link">Blog</a>
                            </li>
                            <li class="nav-item">
                                <a href="#contact" class="nav-link">Contact</a>
                            </li>
                            <li class="nav-item">
                                <a href="#about-us" class="nav-link">About Us</a>
                            </li>
                        </ul>
                    </div>
                    <div class="social-container">
                        <a href="" class="social-item">
                            <i class="fa-brands fa-facebook-f"></i>
                        </a>
                        <a href="" class="social-item">
                            <i class="fa-brands fa-x-twitter"></i>
                        </a>
                        <a href="" class="social-item">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- End Header -->
</body>

</html>
